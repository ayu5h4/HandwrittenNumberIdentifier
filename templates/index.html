<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwritten Digit Detector</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevent scrolling */
            font-family: 'Segoe UI', sans-serif;
            background-color: #000; /* Black background for the page */
        }

        /* Canvas fills the whole screen */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        /* Floating UI Container */
        .ui-layer {
            position: fixed;
            bottom: 40px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none; /* Let clicks pass through to canvas where buttons aren't */
        }

        /* Prediction Text Floating in Top Center */
        .prediction-display {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 2rem;
            font-weight: 300;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        #prediction-number {
            font-weight: 700;
            font-size: 3rem;
            display: block;
        }

        .controls {
            pointer-events: auto; /* Re-enable clicks for buttons */
            background: rgba(255, 255, 255, 0.1); /* Glassmorphism effect */
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 50px;
            display: flex;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Monotone Button Styling */
        button {
            padding: 12px 30px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s ease;
        }

        #btn-predict {
            background-color: #ffffff;
            color: #000000;
            border: 2px solid #ffffff;
        }

        #btn-predict:hover {
            background-color: #e0e0e0;
            border-color: #e0e0e0;
            transform: translateY(-2px);
        }

        #btn-clear {
            background-color: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
        }

        #btn-clear:hover {
            background-color: #ffffff;
            color: #000;
            transform: translateY(-2px);
        }

        /* Instruction text that fades out */
        .instructions {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 1.5rem;
            pointer-events: none;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>

    <div class="prediction-display">
        <span>Prediction</span>
        <span id="prediction-number">?</span>
    </div>

    <div class="instructions" id="guide-text">Draw a digit anywhere</div>

    <canvas id="canvas"></canvas>

    <div class="ui-layer">
        <div class="controls">
            <button id="btn-clear" onclick="clearCanvas()">Clear</button>
            <button id="btn-predict" onclick="predictDigit()">Predict</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        const guideText = document.getElementById('guide-text');

        // --- Resize Canvas to Full Screen ---
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Reset background to black after resize
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Adjust brush size based on screen size (larger screen = thicker brush)
            // This ensures the digit looks "thick" enough when shrunk down to 28x28
            const brushSize = Math.max(window.innerWidth, window.innerHeight) / 50;
            
            ctx.strokeStyle = "white";
            ctx.lineWidth = brushSize;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
        }

        // Initial setup
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- Drawing Logic ---
        function startDrawing(e) {
            isDrawing = true;
            guideText.style.opacity = "0"; // Hide text when user starts drawing
            draw(e);
        }

        function draw(e) {
            if (!isDrawing) return;

            let clientX, clientY;
            
            if(e.type.includes('touch')) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            ctx.lineTo(clientX, clientY);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(clientX, clientY);
        }

        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath();
        }

        // Mouse Events
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        // Touch Events (Mobile)
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent scrolling
            startDrawing(e);
        }, {passive: false});
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            draw(e);
        }, {passive: false});
        
        canvas.addEventListener('touchend', stopDrawing);

        // --- Button Actions ---
        function clearCanvas() {
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            document.getElementById('prediction-number').innerText = "?";
            guideText.style.opacity = "1";
        }

        async function predictDigit() {
            canvas.toBlob(async function(blob) {
                const formData = new FormData();
                formData.append('file', blob, 'digit.png');

                document.getElementById('prediction-number').innerText = "...";
                
                try {
                    const response = await fetch('/predict', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();
                    
                    if (data.error) {
                        alert("Error: " + data.error);
                    } else {
                        document.getElementById('prediction-number').innerText = data.prediction;
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert("Failed to connect to backend.");
                }
            });
        }
    </script>
</body>
</html>
